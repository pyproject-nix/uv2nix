[project]
name = "custom-registry"
version = "0.1.0"
description = "Test project for packages fetched from a custom registry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arpeggio>=2.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
index-url = "https://my-registry.example.com/simple"
